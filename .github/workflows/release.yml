name: Build and release
on:
  push:
    branches: [main]
    paths:
      - 'GlowIconPosition.m'
      - 'GlowIconPosition.plist'
      - 'PositionPreferences.h'
      - 'prefs/**'
      - 'control'
      - 'postinst'
      - 'tests/**'
      - 'build.sh'
      - 'package.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile, sign and validate rootless DEB
        run: bash build.sh
      - name: Verify settings UI and controls in Simulator
        run: bash tests/settings-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GlowIconPosition-DEB
          path: packages/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Settings-UI-check
          path: |
            build/settings-preview.png
            build/settings-smoke.txt
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase Version in control."
            exit 1
          fi
          cat > build/release-notes.md <<'NOTES'
          Replaces the blank preference page with a directly constructed UIKit settings screen containing the position slider, current offset, up/down buttons, reset, description and GitHub link.

          Keeps the original Glow icon, offset-0 default and Sileo respring completion button.

          Install, tap Restart SpringBoard, then open Settings → Tweaks → GlowIconPosition.

          The settings UI and controls are checked in an iOS Simulator harness. Actual PreferenceLoader integration still needs confirmation on your jailbroken device.
          NOTES
          gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" \
            --title "GlowIconPosition $version" --notes-file build/release-notes.md
