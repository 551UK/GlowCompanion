name: Build and release
on:
  push:
    branches: [main]
    paths:
      - 'GlowIconPosition.m'
      - 'GlowIconPosition.plist'
      - 'PositionPreferences.h'
      - 'prefs/**'
      - 'control'
      - 'postinst'
      - 'tests/**'
      - 'build.sh'
      - 'package.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Settings icon size
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp prefs/icons/icon@3x.png "$tmp/source.png"

          make_icon() {
            inner="$1"
            canvas="$2"
            output="$3"
            sips --resampleHeightWidth "$inner" "$inner" "$tmp/source.png" --out "$tmp/small.png" >/dev/null
            sips --padToHeightWidth "$canvas" "$canvas" "$tmp/small.png" --out "$output" >/dev/null
          }

          make_icon 23 29 prefs/icons/icon.png
          make_icon 46 58 prefs/icons/icon@2x.png
          make_icon 69 87 prefs/icons/icon@3x.png
      - name: Compile, sign and validate rootless DEB
        run: bash build.sh
      - name: Verify settings UI and controls in Simulator
        run: bash tests/settings-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GlowIconPosition-DEB
          path: packages/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Settings-UI-check
          path: |
            build/settings-preview.png
            build/settings-smoke.txt
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase Version in control."
            exit 1
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old_tag; do
            [ -z "$old_tag" ] && continue
            [ "$old_tag" = "$tag" ] && continue
            gh release delete "$old_tag" --cleanup-tag --yes
          done
          gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" \
            --title "GlowIconPosition $version" --notes ""
