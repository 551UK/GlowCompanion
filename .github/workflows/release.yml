name: Build and release
on:
  push:
    branches: [main]
    paths:
      - 'GlowIconPosition.m'
      - 'GlowIconPosition.plist'
      - 'PositionPreferences.h'
      - 'prefs/**'
      - 'control'
      - 'build.sh'
      - 'package.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile, sign and validate rootless DEB
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GlowIconPosition-DEB
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase Version in control."
            exit 1
          fi
          cat > build/release-notes.md <<'NOTES'
          Adds a Settings page for moving Glow's entire notification icon row up or down. Offset 0 preserves the working v1.0.0 position. Includes a slider, 10-point adjustment buttons, reset, description, GitHub link and Settings menu icons at 29/58/87 pixels.

          **Install:** Keep Glow installed, install this rootless DEB, then respring. Open Settings → GlowIconPosition. Changes apply when Glow next appears without another respring. Remove GlowIconPosition and respring to undo.

          Targets iOS 16.2 / Dopamine and Glow 0.6-12. Includes arm64 and arm64e. Build, signing and package validation passed. The original position was confirmed working on-device; the new settings controls still require on-device verification.
          NOTES
          gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" \
            --title "GlowIconPosition $version" --notes-file build/release-notes.md
