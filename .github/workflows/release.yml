name: Build and release
on:
  push:
    branches: [main]
    paths:
      - 'GlowIconPosition.m'
      - 'GlowIconPosition.plist'
      - 'PositionPreferences.h'
      - 'prefs/**'
      - 'control'
      - 'postinst'
      - 'tests/**'
      - 'build.sh'
      - 'package.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile, sign and validate rootless DEB
        run: bash build.sh
      - name: Verify settings UI and controls in Simulator
        run: bash tests/settings-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GlowIconPosition-DEB
          path: packages/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Settings-UI-check
          path: |
            build/settings-preview.png
            build/settings-smoke.txt
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase Version in control."
            exit 1
          fi
          cat > build/release-notes.md <<'NOTES'
          Adds an Enable GlowIconPosition switch at the top of the Settings page. It defaults to ON.

          Turning it OFF stops GlowIconPosition from repositioning the notification icons and restores Glow's own original icon placement. Turning it back ON reapplies the saved position without requiring a respring.

          Keeps the vertical position slider, up/down buttons, reset, Glow-style Settings icon, GitHub link and Sileo Restart SpringBoard completion button.

          Install, tap Restart SpringBoard, then open Settings → Tweaks → GlowIconPosition.
          NOTES
          gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" \
            --title "GlowIconPosition $version" --notes-file build/release-notes.md
