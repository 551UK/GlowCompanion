name: Build and release
on:
  push:
    branches: [main]
    paths:
      - 'GlowCompanion.m'
      - 'GlowCompanion.plist'
      - 'control'
      - 'build.sh'
      - 'package.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile, sign and validate rootless DEB
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GlowCompanion-DEB
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase Version in control."
            exit 1
          fi
          cat > build/release-notes.md <<'NOTES'
          Moves Glow's entire notification icon row to the top, below the notch. All notification icons move together; date, time and battery widgets stay in place.

          **Install:** Keep Glow installed, install this rootless DEB, then respring. No settings required. Remove GlowCompanion and respring to undo.

          Targets iOS 16.2 / Dopamine and Glow 0.6-12. Includes arm64 and arm64e. Build, signing and package validation passed; on-device visual testing is still required.
          NOTES
          gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" \
            --title "GlowCompanion $version" --notes-file build/release-notes.md
