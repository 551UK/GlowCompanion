name: Build and release
on:
  push:
    branches: [main]
    paths:
      - 'GlowIconPosition.m'
      - 'GlowIconPosition.plist'
      - 'PositionPreferences.h'
      - 'prefs/**'
      - 'control'
      - 'build.sh'
      - 'package.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile, sign and validate rootless DEB
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GlowIconPosition-DEB
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase Version in control."
            exit 1
          fi
          cat > build/release-notes.md <<'NOTES'
          Uses Glow's original blue icon for the GlowIconPosition Settings entry, with correctly sized 29/58/87-pixel assets.

          Position controls and the default position are unchanged.

          Install this update, then respring and reopen Settings.
          NOTES
          gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" \
            --title "GlowIconPosition $version" --notes-file build/release-notes.md
